<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#11110a">
<title>Distrikt Marquet Interviews</title>
<meta name="description" content="Transkripte der Interviews vom Dreh am 3. November 2026 im Distrikt Marquet, FOUR Frankfurt.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311110a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffe17a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="leiste" id="leiste">
  <a class="marke" href="#/" aria-label="Zur Übersicht">Distrikt Marquet <span>Interviews</span></a>
  <label class="suche" id="suche">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.75"/><path d="M13 13l4.5 4.5"/></svg>
    <input id="sucheFeld" type="search" placeholder="In allen Interviews suchen" autocomplete="off" spellcheck="false" aria-label="In allen Interviews suchen">
    <kbd>/</kbd>
  </label>
</header>

<div class="treffer" id="treffer" hidden>
  <div class="treffer-innen">
    <p class="treffer-kopf" id="trefferKopf"></p>
    <ol id="trefferListe"></ol>
  </div>
</div>

<main id="app" tabindex="-1"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="tplUebersicht">
  <section class="hero">
    <p class="ueber">Dreh am 3. November 2026, FOUR Frankfurt</p>
    <h1><em data-anzahl-personen>Acht</em> Stimmen.</h1>
    <p class="hero-text">Totale von der FX3 mit DIN.CLD.002, Ton vom Ansteckmikro. <span data-stat-minuten>0</span>&nbsp;Minuten Gespräch, <span data-stat-woerter>0</span>&nbsp;Wörter, durchsuchbar mit Timecode.</p>
  </section>
  <section class="bogen" aria-label="Interviews">
    <ol class="raster" id="raster"></ol>
  </section>
  <footer class="fuss">
    <a class="knopf zweit" id="alleLaden" href="#" download>Alle Transkripte als Text</a>
    <p>Transkribiert mit Whisper large-v3-turbo. Maschinell erstellt, Namen und Fachbegriffe vor Verwendung gegenprüfen.</p>
  </footer>
</template>

<template id="tplKarte">
  <li class="karte">
    <a class="karte-link">
      <figure class="karte-bild">
        <img loading="lazy" decoding="async" alt="">
        <span class="karte-dauer"></span>
      </figure>
      <div class="karte-text">
        <h2 class="karte-name"></h2>
        <p class="karte-rolle"></p>
        <p class="karte-zitat"></p>
      </div>
    </a>
  </li>
</template>

<template id="tplPerson">
  <article class="person">
    <div class="person-kopf">
      <a class="zurueck" href="#/" aria-label="Zurück zur Übersicht">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5"/></svg>Alle Interviews
      </a>
      <figure class="person-bild"><img alt=""></figure>
      <div class="person-titel">
        <h1 class="person-name"></h1>
        <p class="person-rolle"></p>
      </div>
      <dl class="person-meta"></dl>
      <div class="person-aktionen">
        <button class="knopf" data-aktion="kopieren" type="button">Text kopieren</button>
        <a class="knopf zweit" data-aktion="laden" href="#" download>Als .txt</a>
        <button class="knopf zweit" data-aktion="drucken" type="button">Drucken</button>
      </div>
    </div>
    <div class="person-text">
      <div class="werkzeug">
        <label class="suche klein">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.75"/><path d="M13 13l4.5 4.5"/></svg>
          <input type="search" placeholder="Im Interview suchen" data-feld="lokal" autocomplete="off" spellcheck="false" aria-label="Im Interview suchen">
          <span class="zaehler" data-zaehler></span>
        </label>
        <label class="schalter">
          <input type="checkbox" data-feld="fragen" checked>
          <span class="schalter-bahn" aria-hidden="true"><span></span></span>
          <span>Fragen<span class="nur-gross"> zeigen</span></span>
        </label>
      </div>
      <div class="transkript" data-transkript></div>
      <nav class="blaettern" aria-label="Weitere Interviews"></nav>
    </div>
  </article>
</template>

<script src="app.js" defer></script>
</body>
</html>
